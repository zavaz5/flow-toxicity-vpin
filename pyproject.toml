[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vpin"
version = "0.1.0"
description = "Replication of Easley, López de Prado and O'Hara (2012), 'Flow Toxicity and Liquidity in a High-Frequency World', on free IVE and BTCUSDT data"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.5.4",
    "pandas==3.0.6",
    "scipy==1.18.1",
    "statsmodels==0.15.0",
    "matplotlib==3.11.2",
    "pyarrow==26.0.0",
    "pyyaml==6.0.3",
    "certifi",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
slides = ["python-pptx==1.0.2", "pymupdf==1.28.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
